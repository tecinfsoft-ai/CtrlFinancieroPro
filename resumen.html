<section id="sec-analisis" class="-mt-20">
    <!-- Cabecera con título y filtros de fecha idénticos a los demás módulos -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div>
            <h2 class="text-2xl font-bold text-stone-800 tracking-tight">ANÁLISIS FINANCIERO</h2>
            <p class="text-xs uppercase font-semibold text-stone-400 tracking-wider mt-0.5">Resumen y métricas del
                periodo</p>
        </div>

        <!-- LADO DERECHO: Filtros de fecha y Botón de acción -->
        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
            <!-- Filtro Del -->
            <div class="flex items-center bg-white border border-stone-300 rounded-full px-3 py-1.5 shadow-sm text-xs">
                <span class="text-stone-400 font-medium mr-2">DEL:</span>
                <input type="date" id="an-fecha-inicio" onchange="guardarFiltrosAnalisis(); refrescarVistaActual();"
                    class="text-xs bg-transparent outline-none font-semibold text-stone-700">
            </div>

            <!-- Filtro Al -->
            <div class="flex items-center bg-white border border-stone-300 rounded-full px-3 py-1.5 shadow-sm text-xs">
                <span class="text-stone-400 font-medium mr-2">AL:</span>
                <input type="date" id="an-fecha-fin" onchange="guardarFiltrosAnalisis(); refrescarVistaActual();"
                    class="text-xs bg-transparent outline-none font-semibold text-stone-700">
            </div>

            <!-- Botón Exportar -->
            <button id="btn-exportar" onclick="generarLibroContable()"
                class="flex items-center gap-1.5 bg-white border border-stone-300 hover:bg-stone-50 text-stone-700 px-3.5 py-2 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm transition-all">
                <span>📊</span> Generar Reporte</button>
        </div>
    </div>

    <!-- resumen-balance-total Contenido de tus métricas, gráficos o utilidad del periodo -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-20">
        <div class="bg-white p-6 rounded-xl-custom soft-shadow">
            <h3 class="text-sm font-bold uppercase text-stone-500 mb-4">Utilidad del Periodo</h3>
            <p id="resumen-balance-total" class="text-3xl font-extrabold text-stone-800 mmb-4 mb-5">$0.00</p>
            <div class="relative h-[300px] flex items-center justify-center">
                <canvas id="chartResumen"></canvas>
            </div>
        </div>
        <div class="bg-white p-8 rounded-xl-custom soft-shadow">
            <h3 class="text-lg font-semibold mb-6 italic">CRONOLOGÍA DEL PERIODO</h3>
            <div id="lista-resumen-periodo" class="space-y-3 list-container"></div>
        </div>
    </div>
</section>
