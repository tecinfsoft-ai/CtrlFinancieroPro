<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Financiero Pro_Test</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="min-h-screen pb-24 md:pt-32 md:pb-10 bg-[#FAF9F6]">

    <!-- BARRA SUPERIOR UNIFICADA -->
    <header id="main-header" class="w-full bg-white/90 backdrop-blur-md border-b border-gray-100 fixed top-0 left-0 z-40 shadow-xs">
        <div class="max-w-5xl mx-auto px-6 py-2.5 flex flex-col md:flex-row justify-between items-center gap-2">

            <!-- LADO IZQUIERDO: Logo, Título y Saludo -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-stone-800 rounded-lg flex items-center justify-center shadow-md flex-shrink-0">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" />
                            <path d="M2 17L12 22L22 17" />
                            <path d="M2 12L12 17L22 12" />
                        </svg>
                    </div>

                    <div class="flex flex-col">
                        <h1 class="text-2xl font-light tracking-tight text-stone-800 italic leading-none">
                            Control <span class="font-bold not-italic">Financiero</span>
                        </h1>
                        <p class="text-[9px] uppercase font-bold text-stone-400 tracking-wider mt-1">
                            Hola, <span id="user-display" class="text-stone-600 font-extrabold">...</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- LADO DERECHO: Fecha Arriba alineada a la Salida + Menú de Navegación Abajo -->
            <div class="flex flex-col items-end w-full md:w-auto gap-1">
                
                <!-- Fecha del sistema posicionada arriba del menú y alineada hacia el borde derecho del botón salir -->
                <div class="pr-3">
                    <p id="fecha-sistema"
                        class="hidden md:block text-[9px] font-bold uppercase tracking-widest text-stone-400 italic">
                    </p>
                </div>

                <!-- Menú de Navegación -->
                <nav class="w-full md:w-auto">
                    <div class="flex justify-around md:justify-end gap-1 md:gap-2" id="main-nav">
                        <button id="nav-home" onclick="showSection('home')"
                            class="nav-btn nav-active px-3 py-2 rounded-lg flex flex-col md:flex-row items-center gap-1 text-[10px] font-bold opacity-50 hover:opacity-100 uppercase tracking-tighter transition-all">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                            <span>Inicio</span>
                        </button>
                        
                        <button id="nav-ingresos" onclick="showSection('ingresos')"
                            class="nav-btn px-3 py-2 rounded-lg flex flex-col md:flex-row items-center gap-1 text-[10px] font-bold opacity-50 hover:opacity-100 uppercase tracking-tighter transition-all">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Ingresos</span>
                        </button>

                        <button id="nav-gastos" onclick="showSection('gastos')"
                            class="nav-btn px-3 py-2 rounded-lg flex flex-col md:flex-row items-center gap-1 text-[10px] font-bold opacity-50 hover:opacity-100 uppercase tracking-tighter transition-all">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Gastos</span>
                        </button>

                        <button id="nav-resumen" onclick="showSection('resumen')"
                            class="nav-btn px-3 py-2 rounded-lg flex flex-col md:flex-row items-center gap-1 text-[10px] font-bold opacity-50 hover:opacity-100 uppercase tracking-tighter transition-all">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                            <span>Análisis</span>
                        </button>

                        <button id="nav-config" onclick="showSection('config')"
                            class="nav-btn px-3 py-2 rounded-lg flex flex-col md:flex-row items-center gap-1 text-[10px] font-bold opacity-50 hover:opacity-100 uppercase tracking-tighter transition-all">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                            <span>Ajustes</span>
                        </button>

                        <button id="nav-salir" onclick="cerrarSesion()"
                            class="nav-btn px-3 py-2 rounded-lg flex flex-col md:flex-row items-center gap-1 text-[10px] font-bold opacity-50 hover:opacity-100 uppercase tracking-tighter transition-all text-red-500">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>Salir</span>
                        </button>
                    </div>
                </nav>

            </div>

        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-container" class="max-w-5xl mx-auto px-6 pt-24 md:pt-28 pb-10">
        <section id="sec-home"></section>
        <section id="sec-ingresos"></section>
        <section id="sec-gastos"></section>
        <section id="sec-resumen"></section>
        <section id="sec-config"></section>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/actions.js"></script>
</body>

</html>
